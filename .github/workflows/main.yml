name: CI

on:
  push:
  pull_request:

jobs:
  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dominikh/staticcheck-action@v1.4.1

  # Interop tests against pinned rsync releases, one per protocol version
  # (29 to 33), plus rsync master and openrsync. See testdata/rsync-matrix.
  interop-matrix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: 'stable'

    - name: install build dependencies
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential bmake libacl1-dev libpopt-dev libssl-dev libxxhash-dev \
          libzstd-dev liblz4-dev zlib1g-dev libidn2-dev

    - uses: actions/cache@v6
      with:
        path: ~/.cache/gokrazy-rsync-matrix
        key: rsync-matrix-${{ runner.os }}-${{ hashFiles('testdata/rsync-matrix/versions.txt', 'testdata/rsync-matrix/build.sh') }}

    - name: build rsync matrix
      run: ./testdata/rsync-matrix/build.sh

    - name: run tests against each rsync
      run: ./testdata/rsync-matrix/run-tests.sh

    # Upstream's token.c on its own, from the master build's tree, so the
    # compressed token streams are checked against it in both directions.
    - name: compare token streams with upstream token.c
      run: |
        make -C internal/rsynctoken/testdata/tokharness RSYNC_SRC=$HOME/.cache/gokrazy-rsync-matrix/src/rsync-master
        go test -count=1 ./internal/rsynctoken

    # Every build again at each older protocol gokrazy/rsync speaks, so the
    # older encodings stay covered as MaxProtocolVersion rises.
    - name: run tests against each rsync at protocols 27, 28 and 29
      run: |
        ./testdata/rsync-matrix/run-tests.sh -p 27
        ./testdata/rsync-matrix/run-tests.sh -p 28
        ./testdata/rsync-matrix/run-tests.sh -p 29

    - name: upload test logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rsync-matrix-test-logs
        path: ~/.cache/gokrazy-rsync-matrix/test-logs

  tests:
    strategy:
      # Let each OS finish, so one failing does not hide the others.
      fail-fast: false
      matrix:
        os:
        - macos-latest
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        # Latest stable version of Go, e.g. 1.20.2
        go-version: 'stable'

    - name: Ensure all files were formatted as per gofmt
      if: matrix.os == 'ubuntu-latest'
      run: |
        [ "$(gofmt -l $(find . -name '*.go') 2>&1)" = "" ]

    - name: go vet
      run: |
        go vet ./...

    - name: install rsync
      if: matrix.os == 'ubuntu-latest'
      run: |
        docker build --pull --no-cache --rm -t=rsync-debian -f testdata/ci-debian.Dockerfile .
        docker build --pull --no-cache --rm -t=rsync-fedora -f testdata/ci-fedora.Dockerfile .

    - name: install rsync
      if: matrix.os == 'windows-latest'
      run: choco install rsync

    - name: run tests (linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        go test -v ./...
        echo "::group::rsync from Debian"
        docker run -v $PWD:/usr/src/rsync/ -w /usr/src/rsync rsync-debian go test ./...
        echo "::endgroup::"
        echo "::group::rsync from Fedora"
        docker run -v $PWD:/usr/src/rsync/ -w /usr/src/rsync rsync-fedora go test ./...
        echo "::endgroup::"

    - name: run tests (macos)
      if: matrix.os == 'macos-latest'
      run: sudo go test -v ./...

    - name: run tests (windows)
      if: matrix.os == 'windows-latest'
      run: go test -v ./...
