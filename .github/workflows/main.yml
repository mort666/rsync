name: CI

# What the Forgejo runners cannot do: the tests on macOS and Windows, and
# against the rsync builds of Debian and Fedora, which need Docker. Forgejo
# runs .forgejo/workflows (the Linux tests, staticcheck and the interop
# matrix) and pushes to this repository, where these run.

on:
  push:
  pull_request:

jobs:
  # Skips the rest for a pull request whose branch is in this repository
  # (its push run covers it), and on master when the merged files already
  # passed this workflow on their branch (.github/scripts/passed-before.sh).
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - id: check
      env:
        GH_TOKEN: ${{ github.token }}
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: .github/scripts/passed-before.sh main.yml

  # The suite against Debian's and Fedora's rsync, in their own images.
  distros:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    name: tests (debian, fedora)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: build the images
      run: |
        docker build --pull --no-cache --rm -t=rsync-debian -f testdata/ci-debian.Dockerfile .
        docker build --pull --no-cache --rm -t=rsync-fedora -f testdata/ci-fedora.Dockerfile .

    - name: run tests
      run: |
        echo "::group::rsync from Debian"
        docker run -v $PWD:/usr/src/rsync/ -w /usr/src/rsync rsync-debian go test ./...
        echo "::endgroup::"
        echo "::group::rsync from Fedora"
        docker run -v $PWD:/usr/src/rsync/ -w /usr/src/rsync rsync-fedora go test ./...
        echo "::endgroup::"

  tests:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    strategy:
      # Let each OS finish, so one failing does not hide the others.
      fail-fast: false
      matrix:
        os:
        - macos-latest
        - windows-latest
        # Windows runs once with each common rsync build: cwRsync from
        # Chocolatey (Cygwin based) and MSYS2's, which Git Bash users add.
        rsync: ['']
        exclude:
        - os: windows-latest
          rsync: ''
        include:
        - os: windows-latest
          rsync: cwrsync
        - os: windows-latest
          rsync: msys2
    name: tests (${{ matrix.os }}${{ matrix.rsync && format(', {0}', matrix.rsync) || '' }})
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        # Latest stable version of Go, e.g. 1.20.2
        go-version: 'stable'

    - name: go vet
      run: |
        go vet ./...

    - name: install rsync (cwRsync)
      if: matrix.rsync == 'cwrsync'
      run: choco install rsync

    - name: install rsync (MSYS2)
      if: matrix.rsync == 'msys2'
      uses: msys2/setup-msys2@v2
      with:
        update: false
        install: rsync

    - name: put MSYS2's rsync on PATH
      if: matrix.rsync == 'msys2'
      shell: msys2 {0}
      run: |
        cygpath -w /usr/bin >> "$GITHUB_PATH"
        rsync --version | head -1

    - name: run tests (macos)
      if: matrix.os == 'macos-latest'
      run: sudo go test -v ./...

    - name: run tests (windows)
      if: matrix.os == 'windows-latest'
      env:
        # MSYS2's rsync makes real Windows symlinks only with this.
        MSYS: ${{ matrix.rsync == 'msys2' && 'winsymlinks:native' || '' }}
      run: go test -v ./...
